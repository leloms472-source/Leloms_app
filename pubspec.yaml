name: leloms_app
description: "LELOMS - Plataforma de estudio para estudiantes de medicina"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.3.4

  # UI y utilidades
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  image_picker: ^1.0.5
  file_picker: ^6.1.1
  url_launcher: ^6.2.2
  flutter_local_notifications: ^16.3.0
  add_2_calendar: ^3.0.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # State management
  provider: ^6.1.1
  fl_chart: ^0.70.2

  # Google Sign-In (for Supabase)
  google_sign_in: ^6.2.1

  # Web
  http: ^1.2.0
  mime: ^1.0.5
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
